    type: Documentation
  description: >-
    Outbound event notifications - HTTP POST requests to a merchant- registered HTTPS endpoint, not a
    WebSocket - fired whenever Appointments, Customers, Employees, Transactions, Form Responses, or Business
    Locations change, plus booking-widget interaction events (tab clicked, book now clicked, service searched,
    time slot clicked, form viewed/submitted, credit card capture viewed, booking completed, gift card/promo
    code applied, customer login, product added/removed from cart, widget loaded). Each event carries
    an id, createdDate, type, action (created/updated/deleted), and a typed payload; delivery follows
    a documented retry policy and endpoints can be signature-verified. A business may register up to 10
    webhooks. Enabling APIs & Webhooks requires a request submitted from Settings > Developers > APIs
    & Webhooks and is limited to paid, non-trial accounts running Credit Card Processing on the computer,
    tablet, Pay Desk, or PayPro version; approval takes roughly five to seven business days.
