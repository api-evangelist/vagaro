name: Vagaro
kind: company
description: Vagaro is a cloud platform for salon, spa, and fitness/wellness business
  management - scheduling, point of sale and payments, marketing, and a consumer
  booking marketplace (Vagaro.com and the Vagaro app). Vagaro publishes a real
  developer surface at docs.vagaro.com, a readme.io-hosted "PUBLIC - Enterprise
  Business API V2" site with a documented OAuth-style Access Token endpoint, five
  REST capability areas (Employee Management, Locations, Appointments, Customers,
  Employees), and an outbound Webhooks system covering Appointments, Customers,
  Employees, Transactions, Form Responses, and Business Locations plus booking-
  widget interaction events, with fully specified event payloads. Access is gated
  behind Settings, Developers, APIs & Webhooks inside a Vagaro business account.
  It requires a paid, non-trial subscription with Credit Card Processing enabled
  on the computer, tablet, Pay Desk, or PayPro version, a submitted request form,
  and roughly five to seven business days for approval before credentials and full
  endpoint reference detail become visible.
