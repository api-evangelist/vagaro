apis:
- aid: vagaro:vagaro-access-token-api
  name: Vagaro Access Token API
  tags:
  - Authentication
  - OAuth
  - Access Token
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.vagaro.com/public/reference/generate-access-token
  baseURL: https://api.vagaro.com
  properties:
  - url: https://docs.vagaro.com/public/reference/api-introduction
    type: Documentation
  - url: https://docs.vagaro.com/public/reference/generate-access-token
    type: APIReference
  - url: openapi/vagaro-openapi.yml
    type: OpenAPI
  description: Exchanges a partner clientId and clientSecretKey, plus a comma-
    separated list of requested scopes, for a bearer access token scoped to a
    business region - POST https://api.vagaro.com/{region}/api/v2/merchants/generate-access-token.
    Documented response codes are 200 (issued), 400 (bad request), 401
    (unauthorized), and 429 (too many requests); each other Vagaro Business API
    reference page lists the specific scope it requires from this token.
- aid: vagaro:vagaro-appointments-api
  name: Vagaro Appointments API
  tags:
  - Appointments
  - Bookings
  - Scheduling
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.vagaro.com/public/reference/api-introduction
  baseURL: https://api.vagaro.com
  properties:
  - url: https://docs.vagaro.com/public/reference/api-introduction
    type: Documentation
  - url: https://docs.vagaro.com/public/docs/appointment-events
    type: Documentation
  - url: openapi/vagaro-openapi.yml
    type: OpenAPI
  description: Retrieve appointment records - booking status (Confirmed, Awaiting
    Confirmation, No Show, Service Completed, and similar values), start/end time,
    service and service provider, customer, and booking source. Vagaro's own
    reference describes this area only at the capability level ("retrieve details
    about appointments including status, start time, and service provider")
    without exposing the full path/parameter list outside an approved partner
    account; the endpoints here are honestly modeled from that description and
    from the confirmed Appointment webhook payload schema, not fabricated or
    verified against a live response.
  endpointsModeled: true
