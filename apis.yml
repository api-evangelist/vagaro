    type: OpenAPI
  description: Assign and unassign employees across multiple business locations
    with a specified access level, and provision or deprovision a bookable
    calendar for an employee. Vagaro documents this only as a capability summary
    ("easily manage employees across multiple locations by assigning and
    unassigning them while specifying what access level they should have");
    endpoints here are honestly modeled from that description, not verified
    against the gated live reference.
  endpointsModeled: true
