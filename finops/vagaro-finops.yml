principles:
- name: Visibility
  description: Track per-calendar subscription cost alongside monthly processing volume to see the two dominant Vagaro cost drivers together.
- name: Allocation
  description: For multi-location businesses, allocate calendar and processing costs per location/business unit rather than as one blended bill.
- name: Optimization
  description: Match calendar count to actual active providers, review Small vs. Large Merchant processing thresholds monthly, and audit add-on subscriptions (Text Marketing, MySite, Branded App) for actual usage.
- name: Accountability
  description: Assign an owner for the Enterprise Sales relationship if APIs & Webhooks are enabled, since that spend is contracted outside the standard self-serve subscription.
