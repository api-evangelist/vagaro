description: >-
  FinOps view of Vagaro spend for a business running its operations on the
  platform. The dominant recurring cost is the monthly software subscription,
  priced per bookable calendar/provider (roughly $30/month for one calendar,
  scaling up roughly $10/month per additional calendar). A second, usage-based
  cost stream is payment processing: no added monthly fee under about
  $4,000/month processed, a small added monthly fee above that threshold, plus
  per-transaction card-processing rates (swiped/dipped/tapped vs. keyed-in vs.
  online). Optional add-ons (Text Marketing, MySite website, Branded App) are
  additional flat monthly charges. The developer surface itself (Access Token
  API, REST capability areas, Webhooks) carries no separately published usage
  meter or fee - it is bundled into an Enterprise Sales agreement rather than
  billed per call or per event.
notes: >-
  Per-transaction processing rates and exact enterprise/API pricing are not
  published publicly; verify current rates directly with Vagaro before
  building a cost model. This entry should be reconciled once concrete
  contract terms are available.
